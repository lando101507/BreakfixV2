
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BreakFix</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 16px;
            background:
                radial-gradient(circle at 15% 15%, #172e58 0, transparent 40%),
                linear-gradient(120deg, #0b1730, #080f20 75%);
            color: #ffffff;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 30px 35px;
            border: 2px solid transparent;
            border-radius: 25px;
            background:
                linear-gradient(#111827, #111827) padding-box,
                linear-gradient(
                    135deg,
                    #a855f7,
                    #ec4899,
                    #06b6d4,
                    #facc15,
                    #a855f7
                ) border-box;
            background-size: auto, 300% 300%;
            animation: borderGlow 6s ease infinite;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes borderGlow {
            0% {
                background-position: 0 0, 0% 50%;
            }
            50% {
                background-position: 0 0, 100% 50%;
            }
            100% {
                background-position: 0 0, 0% 50%;
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            border-radius: 17px;
            background: #2864ed;
            color: #ffffff;
            font-size: 29px;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.22);
        }

        .logo h1 {
            font-size: 27px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #9caec6;
            font-size: 12px;
            margin-top: 7px;
            letter-spacing: 0.5px;
        }

        .form-title {
            font-size: 27px;
            font-weight: 750;
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            color: #9caec6;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
            margin-bottom: 25px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.6;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 650;
            margin-bottom: 9px;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7186a3;
            font-size: 17px;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 12px 14px 12px 44px;
            background: #111b2b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3478f6;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
        }

        .submit-btn {
            width: 100%;
            min-height: 47px;
            padding: 13px 16px;
            border: none;
            border-radius: 12px;
            background: #2864ed;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .submit-btn i {
            margin-right: 7px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 7px 20px rgba(37, 99, 235, 0.22);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background: #293548;
            margin: 24px 0 20px;
        }

        .back-link {
            text-align: center;
            font-size: 12px;
            color: #9caec6;
        }

        .back-link a {
            color: #60a5fa;
            font-weight: 650;
            text-decoration: none;
            margin-left: 5px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 22px;
                border-radius: 21px;
            }

            .form-title {
                font-size: 24px;
            }

            .logo h1 {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container {
                animation: none;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-tools"></i>
            </div>
            <h1>Forgot Password?</h1>
            <p>BREAKFIX WORKSPACE</p>
        </div>

        <p class="description">
            No worries! Enter your registered email address
            and we'll help you reset your password.
        </p>

        {% if error %}
            <div class="message error" role="alert">
                <i class="bi bi-exclamation-circle"></i>
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="message success" role="status">
                <i class="bi bi-check-circle"></i>
                {{ success }}
            </div>
        {% endif %}

        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="form-group">
                <label for="email">Work Email</label>

                <div class="input-wrapper">
                    <i class="bi bi-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@company.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="bi bi-send"></i>
                Send Reset Link
            </button>
        </form>

        <div class="divider"></div>

        <div class="back-link">
            Remember your password?
            <a href="{{ url_for('login') }}">
                Back to Login
            </a>
        </div>

    </div>
</body>
</html>
